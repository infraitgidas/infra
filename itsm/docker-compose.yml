# ================================================================
# docker-compose.yml — GLPI ITSM Stack
# ================================================================
# Services: mariadb, glpi (imagen oficial glpi/glpi), nginx (reverse proxy)
# ================================================================
# NOTA (2026-08-06): migrado de diouxx/glpi (abandonada, sin tags 10.0)
# a la imagen oficial glpi/glpi. Cambios clave:
#   - Variables: MARIADB_* -> GLPI_DB_* (formato de la imagen oficial)
#   - Datos: /var/www/html/glpi/{config,files} -> volumen unico /var/glpi
#   - Instalacion: autoinstall al primer arranque (GLPI_SKIP_AUTOINSTALL)
# ================================================================

services:
  mariadb:
    image: mariadb:10.11
    container_name: glpi-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?root password required}
      MYSQL_DATABASE: ${GLPI_DB_NAME:-glpi}
      MYSQL_USER: ${GLPI_DB_USER:-glpi}
      MYSQL_PASSWORD: ${GLPI_DB_PASSWORD:?db password required}
    volumes:
      - glpi_mariadb_data:/var/lib/mysql
      - ${PWD}/config/mariadb:/etc/mysql/conf.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - glpi_net

  glpi:
    image: glpi/glpi:10.0
    container_name: glpi-app
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      GLPI_DB_HOST: mariadb
      GLPI_DB_PORT: 3306
      GLPI_DB_NAME: ${GLPI_DB_NAME:-glpi}
      GLPI_DB_USER: ${GLPI_DB_USER:-glpi}
      GLPI_DB_PASSWORD: ${GLPI_DB_PASSWORD:?db password required}
      TIMEZONE: ${GLPI_TIMEZONE:-America/Argentina/Buenos_Aires}
      GLPI_LANG: ${GLPI_LANG:-es_AR}
      GLPI_SKIP_AUTOINSTALL: ${GLPI_SKIP_AUTOINSTALL:-false}
      GLPI_SKIP_AUTOUPDATE: ${GLPI_SKIP_AUTOUPDATE:-false}
    volumes:
      - glpi_data:/var/glpi
      - glpi_plugins:/var/www/glpi/plugins
      - glpi_marketplace:/var/www/glpi/marketplace
    healthcheck:
      test: ["CMD", "php", "-r", "exit((@file_get_contents('http://localhost/')!==false)?0:1);"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - glpi_net

  nginx:
    image: nginx:1.25-alpine
    container_name: glpi-nginx
    restart: unless-stopped
    depends_on:
      glpi:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ${PWD}/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - glpi_net

networks:
  glpi_net:
    name: glpi_network
    driver: bridge

volumes:
  glpi_mariadb_data:
    name: glpi_mariadb_data
  glpi_data:
    name: glpi_data
  glpi_plugins:
    name: glpi_plugins
  glpi_marketplace:
    name: glpi_marketplace
